# /etc/agentconnect/config.toml for the separate-OS-user mode (docs/isolation.md).
# Owner root, group agentconnect, mode 0640. Every key is in docs/config.md.

[relay]
url = "wss://relay.example.org"

[daemon]
data_dir = "/var/lib/agentconnect"
display_name = "agent"
keystore = "file"                  # no login keyring for a system user

[isolation]
enabled = true
agent_dir = "/run/agentconnect"
group = "agentconnect"
agent_users = []                # the agents' users, e.g. ["agent"]
human_users = []                # add 0 to allow `sudo agentconnect ...` as root

# Receivers are Unix sockets in this mode, in the agent's receiver directory
# (agentconnect.tmpfiles.conf). Uncomment what the agent uses.
# [webhook]
# callback_socket = "/run/agentconnect-recv/agent/hook.sock"
#
# [a2a]
# local_agent_url = "http://localhost/"
# local_agent_socket = "/run/agentconnect-recv/agent/a2a.sock"

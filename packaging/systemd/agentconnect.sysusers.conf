# The daemon's own user and group (docs/isolation.md).
# Install to /usr/lib/sysusers.d/agentconnect.conf and run systemd-sysusers.
u agentconnect - "AgentConnect daemon" /var/lib/agentconnect /usr/sbin/nologin

# Agent users join the group to reach the socket; list them in
# isolation.agent_users too. For example:
# m agent agentconnect

# Directories for the separate-OS-user mode (docs/isolation.md).
# Install to /usr/lib/tmpfiles.d/agentconnect.conf.
# The data directory: private to the daemon's user.
d /var/lib/agentconnect 0700 agentconnect agentconnect -
# The configuration: readable by the daemon's group, no secrets in it.
d /etc/agentconnect 0750 root agentconnect -
# The agent directory (/run/agentconnect) comes from RuntimeDirectory= in
# agentconnectd.service; without that unit, create it here:
# d /run/agentconnect 0750 agentconnect agentconnect -
# Receiver directories: one per agent user whose webhook or A2A agent the
# daemon delivers to (webhook.callback_socket, a2a.local_agent_socket). The
# agent's user owns it; setgid agentconnect, so its socket gets the group and
# the daemon can connect. The daemon also checks the socket's user.
d /run/agentconnect-recv 0755 root root -
# d /run/agentconnect-recv/agent 2750 agent agentconnect -

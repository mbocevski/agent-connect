[workspace]
resolver = "3"
members = ["core", "core-py", "relay", "spikes/mls-xwing"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/mbocevski/agent-connect"
publish = false

[workspace.dependencies]
agentconnect-core = { path = "core" }
axum = "0.8.9"
hkdf = "0.13.0"
# OpenMLS is pre-1.0: pin exactly. The X-Wing ciphersuite is behind the
# `draft-ietf-mls-pq-ciphersuites` feature (SPEC §3.1, ADR-001 §2).
openmls = { version = "=0.9.1", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_sqlite_storage = { version = "=0.3.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace]
resolver = "3"
members = ["core", "core-py", "directory", "relay"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/mbocevski/agent-connect"
publish = false

[workspace.dependencies]
agentconnect-core = { path = "core" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
base64ct = { version = "1.8.3", features = ["alloc"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "http1",
    "native-tokio",
    "ring",
    "tls12",
] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hkdf = "0.13.0"
hmac = "0.13.0"
# OpenMLS is pre-1.0: pin exactly. The PQ hybrid ciphersuite is behind the
# `draft-ietf-mls-pq-ciphersuites` feature (SPEC §3.1, ADR-001 §2).
openmls = { version = "=0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_sqlite_storage = { version = "=0.3.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
proptest = "1.12.0"
rmcp = { version = "3.7.0", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Same rusqlite as openmls_sqlite_storage, so its `Connection` is SQLCipher.
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
rand_chacha = "0.10.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# NFC for the one-line text rule (SPEC §13.1.2), pinned exactly to the
# release whose tables are Unicode 17.0.0, like unicode-properties below.
unicode-normalization = { version = "=0.1.25", default-features = false }
# Unicode general categories and the `Emoji` property for the one-line text
# rule (SPEC §13.1.2), pinned exactly: its tables are Unicode 17.0.0, which
# the SPEC names.
unicode-properties = { version = "=0.1.4", default-features = false, features = [
    "emoji",
    "general-category",
] }
zeroize = { version = "1.9.1", features = ["derive"] }

# TEMPORARY, added 2026-10-18 for RUSTSEC-2026-0329, RUSTSEC-2026-0330 and
# RUSTSEC-2026-0331. openmls_libcrux_crypto 0.4.0, the latest crates.io
# release, pins the affected libcrux-kem 0.0.9 and libcrux-hmac-drbg 0.0.1;
# upstream openmls main depends on the fixed releases.
#
# The patch is mixed on purpose: only the provider side (openmls_traits,
# openmls_libcrux_crypto, openmls_memory_storage, openmls_rust_crypto)
# comes from main, while openmls 0.9.2, openmls_basic_credential 0.6.0 and
# openmls_sqlite_storage 0.3.0 stay on crates.io. Main's openmls has
# openmls_sqlite_storage as an optional dependency on rusqlite 0.40, whose
# libsqlite3-sys 0.38 conflicts (one `links = "sqlite3"` per build) with
# sqlx 0.9, which allows < 0.38. The patched openmls_traits differs from
# 0.6.0 only behind features we don't enable (`async`,
# `targeted-messages-draft`, `virtual-clients-draft`); turning one on fails
# to compile rather than changing behaviour.
#
# Every workspace in the tree (the fuzz ones too) carries this exact table.
# `deny.toml` allows only this git source and requires a `rev`;
# `scripts/check_cargo_patch.py` (in `just lint`) also requires the rev to be
# a full commit SHA, the same table in every workspace and no affected
# libcrux crate in any Cargo.lock.
#
# Remove this block once crates.io has an openmls_libcrux_crypto release
# (with matching openmls_traits and openmls_memory_storage) that depends on
# libcrux-kem >= 0.0.10 and libcrux-hmac-drbg >= 0.0.2 and works with the
# openmls release pinned above. The nightly `check_cargo_patch.py upstream`
# step fails when one appears. A sqlx release that allows libsqlite3-sys
# 0.38 is only needed to patch the whole family to an upstream commit.
[patch.crates-io]
openmls_libcrux_crypto = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }
# Not built (an optional dependency of openmls and the provider), but its
# 0.6.0 release would keep hpke-rs 0.7 and libcrux-kem 0.0.9 in Cargo.lock.
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

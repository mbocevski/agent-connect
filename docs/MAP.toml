# What scripts/check_docs.py (just docs-check, pre-push, the CI `docs` job)
# enforces. Globs use fnmatch syntax (`*` also matches `/`).
#
# [[rule]]      User-facing code and the docs that must change with it. A
#                commit that isn't docs/test/ci/chore/build/style and changes
#                `code` fails unless one of the rule's `docs` changed anywhere
#                on the branch. Escape hatch: the `skip-docs` PR label.
# [[component]]  The inventory behind the README Status section. Each
#                component has exactly one Status bullet, marked
#                `<!-- component: <name> -->`, which links the component's
#                `doc`. A branch with a new CHANGELOG `### Added` entry that
#                changes a component's `paths` must also change README.md.
#                Escape hatch: the `skip-readme` PR label. `readme = false`
#                is for parts with no Status bullet (test tooling, spikes).
#                Every Cargo and uv workspace member needs a component whose
#                `paths` cover its directory (`member/**`).
# internal       Source files that are not user-facing. Every .rs/.py file
#                under a crate or package's src directory must match a rule's
#                `code` or `internal`, so new files get classified.

internal = [
    # core: storage, time, errors, test support.
    "core/src/lib.rs",
    "core/src/clock.rs",
    "core/src/db.rs",
    "core/src/error.rs",
    "core/src/failpoint.rs",
    "core/src/group/tests.rs",
    "core/src/group/group_mode_tests.rs",
    "core/src/group/knock_tests.rs",
    "core/src/group/sas_grind_tests.rs",
    "core/src/journal.rs",
    "core/src/mls.rs",
    "core/src/provider.rs",
    "core/src/records.rs",
    "core/src/rng.rs",
    "core/src/vectors.rs",
    # core: the operator links the relay and the directory show (their
    # READMEs document the settings).
    "core/src/operator.rs",
    # core-py: bindings; the checks they call are in core.
    "core-py/src/**",
    # relay: process entry point, storage and the deadline clock.
    "relay/src/lib.rs",
    "relay/src/main.rs",
    "relay/src/sqlite.rs",
    "relay/src/store.rs",
    "relay/src/timer.rs",
    # daemon: plumbing behind the CLI, the API and the adapters.
    "daemon/src/agentconnect/__init__.py",
    "daemon/src/agentconnect/adapter.py",
    "daemon/src/agentconnect/apiclient.py",
    "daemon/src/agentconnect/backoff.py",
    "daemon/src/agentconnect/clock.py",
    "daemon/src/agentconnect/failpoints.py",
    "daemon/src/agentconnect/identity.py",
    "daemon/src/agentconnect/log.py",
    "daemon/src/agentconnect/relay.py",
    "daemon/src/agentconnect/sas_emoji.py",
    "daemon/src/agentconnect/shapes.py",
    "daemon/src/agentconnect/sockets.py",
    "daemon/src/agentconnect/store.py",
    "daemon/src/agentconnect/tasks.py",
    # harness: test tooling.
    "harness/src/**",
]

[[rule]]
name = "cli"
# The commands, and provisioning a replica, which only the CLI does.
code = [
    "daemon/src/agentconnect/cli.py",
    "daemon/src/agentconnect/cli_json.py",
    "daemon/src/agentconnect/cli_support.py",
    "daemon/src/agentconnect/provision.py",
]
docs = ["docs/cli.md"]

[[rule]]
name = "local-api"
code = ["daemon/src/agentconnect/runtime/api.py"]
docs = ["docs/api.md"]

[[rule]]
name = "daemon-config"
code = ["daemon/src/agentconnect/config.py"]
docs = ["docs/config.md"]

[[rule]]
name = "webhook-adapter"
code = [
    "daemon/src/agentconnect/webhook.py",
    "daemon/src/agentconnect/sse.py",
    "daemon/src/agentconnect/payloads.py",
    "daemon/src/agentconnect/adapters.py",
]
docs = ["docs/adapters/webhook.md"]

[[rule]]
name = "safety-policy"
code = [
    "daemon/src/agentconnect/policy.py",
    "daemon/src/agentconnect/limits.py",
    "daemon/src/agentconnect/schemas.py",
]
docs = ["docs/safety.md"]

[[rule]]
name = "runtime-hosts"
code = [
    "daemon/src/agentconnect/runtime/**",
    "daemon/src/agentconnect/callback.py",
    "daemon/src/agentconnect/daemon/*.py",
]
# The local API's routes are documented in docs/api.md (rule local-api), the
# listing in docs/discovery.md (rule discovery), membership in docs/groups.md
# (rule group-mode).
exclude = [
    "daemon/src/agentconnect/runtime/api.py",
    "daemon/src/agentconnect/runtime/listing.py",
    "daemon/src/agentconnect/runtime/knocks.py",
    "daemon/src/agentconnect/runtime/groups.py",
    "daemon/src/agentconnect/runtime/floor.py",
    "daemon/src/agentconnect/runtime/sas.py",
]
docs = ["docs/sdk.md", "docs/adr/005-deployment-modes.md"]

[[rule]]
name = "discovery"
# The owner's listing, its doors and renewal, knocking and knock approvals,
# and the fetches to directories and owner domains.
code = [
    "daemon/src/agentconnect/runtime/listing.py",
    "daemon/src/agentconnect/runtime/knocks.py",
    "daemon/src/agentconnect/directory_client.py",
    "daemon/src/agentconnect/ownerfile.py",
]
docs = ["docs/discovery.md"]

[[rule]]
name = "group-mode"
# Membership: leaves, removals, the events they raise, the update cadence;
# floor control in moderated groups; SAS runs.
code = [
    "daemon/src/agentconnect/runtime/groups.py",
    "daemon/src/agentconnect/runtime/floor.py",
    "daemon/src/agentconnect/runtime/sas.py",
]
docs = ["docs/groups.md"]

[[rule]]
name = "isolation"
code = ["daemon/src/agentconnect/isolation.py"]
docs = ["docs/isolation.md"]

[[rule]]
name = "local-secrets"
# Where the keys and the local API tokens live, and who can read them.
code = ["daemon/src/agentconnect/keystore.py", "daemon/src/agentconnect/tokens.py"]
docs = ["docs/isolation.md", "docs/config.md", "docs/safety.md"]

[[rule]]
name = "python-sdk"
code = ["sdk/python/src/agentconnect_sdk/*.py"]
docs = ["docs/sdk.md"]

[[rule]]
name = "mcp-adapter"
# The MCP server (agentconnect mcp) and the delivery queue its sessions pull.
code = ["daemon/src/agentconnect/mcp/*.py", "daemon/src/agentconnect/deliveries.py"]
docs = ["docs/adapters/mcp.md"]

[[rule]]
name = "a2a-adapter"
code = ["daemon/src/agentconnect/a2a_adapter/*.py"]
docs = ["docs/adapters/a2a.md"]

[[rule]]
name = "core-protocol"
# The modules that implement a SPEC section, other than discovery.
code = [
    "core/src/encoding.rs",
    "core/src/export.rs",
    "core/src/group.rs",
    "core/src/identity.rs",
    "core/src/invite.rs",
    "core/src/join.rs",
    "core/src/ledger.rs",
    "core/src/padding.rs",
    "core/src/policy.rs",
    "core/src/sas.rs",
]
docs = ["SPEC.md"]

[[rule]]
name = "discovery-core"
# Signed listings, tokens, withdrawals, owner verification (§13), doors and
# knocks (§6.6).
# The address rule for fetches from listing text (§13.2.4) is `net`.
code = ["core/src/listing/**", "core/src/knock*", "core/src/net.rs"]
docs = ["SPEC.md"]

[[rule]]
name = "relay-protocol"
code = [
    "relay/src/auth.rs",
    "relay/src/config.rs",
    "relay/src/conn.rs",
    "relay/src/landing.rs",
    "relay/src/logging.rs",
    "relay/src/proto.rs",
    "relay/src/quota.rs",
    "relay/src/relay.rs",
    "relay/src/replay.rs",
    "relay/src/restart.rs",
    "relay/src/rest.rs",
    "relay/src/server.rs",
    "relay/src/ws.rs",
]
docs = ["SPEC.md", "relay/README.md"]

[[rule]]
name = "directory-protocol"
code = ["directory/src/**"]
docs = ["SPEC.md", "directory/README.md"]

[[rule]]
name = "wire-formats"
code = ["testdata/*.json"]
# The manifest lists files; it isn't a wire format.
exclude = ["testdata/MANIFEST.json"]
docs = ["SPEC.md"]

[[component]]
name = "core"
paths = ["core/**", "core-py/**"]
doc = "SPEC.md"

[[component]]
name = "relay"
paths = ["relay/**"]
doc = "relay/README.md"

[[component]]
name = "directory"
paths = ["directory/**"]
doc = "directory/README.md"

[[component]]
name = "discovery"
paths = [
    "core/src/listing/**",
    "core/src/knock*",
    "core/src/net.rs",
    "core-py/src/discovery.rs",
    "daemon/src/agentconnect/runtime/listing.py",
    "daemon/src/agentconnect/runtime/knocks.py",
    "daemon/src/agentconnect/directory_client.py",
    "daemon/src/agentconnect/ownerfile.py",
]
doc = "docs/adr/006-discovery.md"

[[component]]
name = "group-mode"
paths = [
    "daemon/src/agentconnect/runtime/groups.py",
    "daemon/src/agentconnect/runtime/floor.py",
    "daemon/src/agentconnect/runtime/sas.py",
    "core/src/policy.rs",
]
doc = "docs/groups.md"

[[component]]
name = "runtime"
paths = ["daemon/**"]
doc = "docs/adr/005-deployment-modes.md"

[[component]]
name = "cli"
paths = [
    "daemon/src/agentconnect/cli*.py",
    "daemon/src/agentconnect/apiclient.py",
    "daemon/src/agentconnect/provision.py",
]
doc = "docs/cli.md"

[[component]]
name = "safety-policy"
paths = [
    "daemon/src/agentconnect/policy.py",
    "daemon/src/agentconnect/limits.py",
    "daemon/src/agentconnect/schemas.py",
]
doc = "docs/safety.md"

[[component]]
name = "isolation"
paths = ["daemon/src/agentconnect/isolation.py"]
doc = "docs/isolation.md"

[[component]]
name = "sdk"
paths = [
    "sdk/python/**",
    "daemon/src/agentconnect/runtime/**",
    "daemon/src/agentconnect/callback.py",
]
doc = "docs/sdk.md"

[[component]]
name = "a2a-adapter"
paths = ["daemon/src/agentconnect/a2a_adapter/**"]
doc = "docs/adapters/a2a.md"

[[component]]
name = "webhook-adapter"
paths = [
    "daemon/src/agentconnect/webhook.py",
    "daemon/src/agentconnect/sse.py",
    "daemon/src/agentconnect/payloads.py",
    "daemon/src/agentconnect/adapters.py",
]
doc = "docs/adapters/webhook.md"

[[component]]
name = "mcp-adapter"
paths = ["daemon/src/agentconnect/mcp/**", "daemon/src/agentconnect/deliveries.py"]
doc = "docs/adapters/mcp.md"

[[component]]
name = "harness"
paths = ["harness/**"]
doc = "TESTING.md"
readme = false

[[component]]
name = "spikes"
paths = ["spikes/**"]
doc = "docs/spikes/mls-xwing.md"
readme = false

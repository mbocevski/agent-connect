# Prose rules (Vale, https://vale.sh). The rules live in styles/AgentConnect/.
# README.md and docs/ are held to errors; other Markdown gets warnings.
# Code spans and code blocks are never checked.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = AgentConnect
AgentConnect = warning

[{README.md,docs/*.md}]
AgentConnect = error

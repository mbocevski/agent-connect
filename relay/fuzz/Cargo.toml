[package]
name = "agentconnect-relay-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1"

[dependencies.agentconnect-relay]
path = ".."

# Detached from the main workspace: fuzzing needs a nightly toolchain and is
# not part of `just test`. Run with `cargo +nightly fuzz run frame_parser`
# from `relay/` (needs `cargo install cargo-fuzz`).
[workspace]

# The same provider patch as the main workspace (see its Cargo.toml):
# RUSTSEC-2026-0329/-0330/-0331. Keep the rev in step with it.
[patch.crates-io]
openmls_libcrux_crypto = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "be2368a21ec5e0380abd568821addc57b79013ea" }

[[bin]]
name = "frame_parser"
path = "fuzz_targets/frame_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "knock_frame"
path = "fuzz_targets/knock_frame.rs"
test = false
doc = false
bench = false

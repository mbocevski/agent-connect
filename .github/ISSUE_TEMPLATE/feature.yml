name: Feature request
description: Propose a feature or protocol change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why doesn't AgentConnect support it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. For protocol changes, note the impact on SPEC.md and the threat model (§12).
    validations:
      required: true

# The fast tier (`just test`) on the platforms beyond x86_64 Linux. Called from
# ci.yml (pull requests, non-required) and nightly.yml.
name: platform-tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_FROZEN: "1"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just,cargo-nextest
      - run: uv sync --all-packages
      - run: just test
      # No Homebrew or system crypto: record what the binaries link against.
      - name: Linkage (macOS)
        if: runner.os == 'macOS'
        run: |
          native="$(find .venv -name '_native*.so' | head -n 1)"
          scripts/check-macos-linkage.sh target/debug/agentconnect-relay "$native"
      - name: Linkage (Linux)
        if: runner.os == 'Linux'
        run: |
          native="$(find .venv -name '_native*.so' | head -n 1)"
          ldd target/debug/agentconnect-relay "$native"
      # Informational: is the login Keychain usable on a hosted runner?
      - name: Keychain probe (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: uv run --all-packages python scripts/keychain_probe.py

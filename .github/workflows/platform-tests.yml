# The fast tier (`just test`) on the platforms beyond x86_64 Linux. Called from
# ci.yml (pull requests, non-required) and nightly.yml.
name: platform-tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_FROZEN: "1"
  # The workspace pulls openmls from GitHub (`[patch.crates-io]`): fetch it
  # with the git CLI, which recovers from the TLS errors libgit2 did not,
  # and retry network operations more than cargo's default of 3.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just,cargo-nextest
      - run: uv sync --all-packages
      - run: just test
      # No Homebrew or system crypto: record what the binaries link against.
      - name: Linkage (macOS)
        if: runner.os == 'macOS'
        run: |
          native="$(uv run --all-packages python -c 'import agentconnect_core._native as m; print(m.__file__)')"
          scripts/check-macos-linkage.sh target/debug/agentconnect-relay "$native"
      - name: Linkage (Linux)
        if: runner.os == 'Linux'
        run: |
          native="$(uv run --all-packages python -c 'import agentconnect_core._native as m; print(m.__file__)')"
          ldd target/debug/agentconnect-relay "$native"
      # Informational: is the login Keychain usable on a hosted runner?
      - name: Keychain probe (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: uv run --all-packages python scripts/keychain_probe.py

name: ci

on:
  pull_request:
    # labeled and unlabeled start a fresh run, so the skip-* labels are read
    # from the current label set (a re-run reuses the old event payload).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UV_FROZEN: "1"
  # The workspace pulls openmls from GitHub (`[patch.crates-io]`): fetch it
  # with the git CLI, which recovers from the TLS errors libgit2 did not,
  # and retry network operations more than cargo's default of 3.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  # Which jobs the change needs (scripts/changes.py, TESTING.md "Which CI jobs
  # run when"). Pushes to main and manual runs always run everything. lint,
  # changelog, docs and hygiene always run: they are cheap text checks.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run_rust: ${{ steps.classify.outputs.run_rust }}
      run_python: ${{ steps.classify.outputs.run_python }}
      run_licences: ${{ steps.classify.outputs.run_licences }}
      run_contract: ${{ steps.classify.outputs.run_contract }}
      run_platforms: ${{ steps.classify.outputs.run_platforms }}
      run_image: ${{ steps.classify.outputs.run_image }}
      run_integration: ${{ steps.classify.outputs.run_integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # No code of the pull request runs here. It is classified by the
          # base branch's copy of the script, never its own: otherwise the
          # change under test could decide which checks it faces. Pushes,
          # manual runs and a base that has no script (the pull request that
          # adds it) run everything, which is printed inline. Any git error
          # fails the step; only a clean "the base has no such file" runs
          # everything.
          everything() {
            for job in rust python licences contract platforms image integration; do
              echo "run_$job=true"
            done | tee -a "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != pull_request ]; then
            everything
            exit 0
          fi
          git rev-parse --verify --quiet "origin/$BASE^{commit}" > /dev/null
          present="$(git ls-tree --name-only "origin/$BASE" -- scripts/changes.py)"
          if [ -z "$present" ]; then
            everything
            exit 0
          fi
          git show "origin/$BASE:scripts/changes.py" > "$RUNNER_TEMP/changes.py"
          # --no-renames lists both paths of a rename.
          git diff --no-renames --name-only "origin/$BASE...HEAD" > changed.txt
          python3 "$RUNNER_TEMP/changes.py" classify < changed.txt | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-shear
      - run: uv sync --all-packages
      # Hook environments (lychee is built from source, Vale with Go).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv tool install prek==0.5.5
      - run: prek run --all-files --show-diff-on-failure

  rust:
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny
      - run: just deny
      - run: just cov-rust

  python:
    needs: changes
    if: needs.changes.outputs.run_python == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: uv sync --all-packages
      - run: uv run --all-packages ty check
      - run: just cov-py

  # Python dependency licences (licences-py.toml), the counterpart of cargo-deny.
  licences:
    needs: changes
    if: needs.changes.outputs.run_licences == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: just licences

  # Cross-language contract data: testdata/MANIFEST.json vs. the test suites.
  contract:
    needs: changes
    if: needs.changes.outputs.run_contract == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: just contract

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: scripts/check-changelog.sh "origin/${{ github.base_ref }}"

  # Docs must change with the user-facing code they describe (docs/MAP.toml).
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - env:
          SKIP_DOCS: ${{ contains(github.event.pull_request.labels.*.name, 'skip-docs') }}
          SKIP_README: ${{ contains(github.event.pull_request.labels.*.name, 'skip-readme') }}
        run: uv run --no-project python scripts/check_docs.py "origin/${{ github.base_ref }}"

  # Commit messages and PR text must not carry AI-tool attribution.
  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --no-project python scripts/hygiene.py range "origin/${{ github.base_ref }}"
      # The author comes from the PR data, not the branch name or the actor.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | uv run --no-project python scripts/hygiene.py pr "$PR_AUTHOR"

  # Linux arm64 and macOS arm64 run the fast tier. Not part of ci-ok until
  # they have a track record of staying green and fast (see ADR-001); the same
  # workflow also runs nightly.
  platforms:
    needs: changes
    if: needs.changes.outputs.run_platforms == 'true'
    uses: ./.github/workflows/platform-tests.yml

  # The relay and directory images must build for both architectures. Each
  # architecture builds on a native runner (no QEMU emulation); nothing is
  # pushed.
  image:
    needs: changes
    if: needs.changes.outputs.run_image == 'true'
    name: image (${{ matrix.component }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [relay, directory]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker buildx build --load --platform linux/${{ matrix.arch }} -t ac-${{ matrix.component }}:ci -f ${{ matrix.component }}/Dockerfile .
      # Run the image: print the binary's NEEDED libraries and wait for /healthz,
      # which proves the loader finds libgcc_s on this architecture.
      - run: scripts/smoke-image.sh ${{ matrix.component }} ac-${{ matrix.component }}:ci linux/${{ matrix.arch }}
        timeout-minutes: 5
      # Trivy scan of the amd64 images (OS packages and bundled binaries). Fails
      # on fixable HIGH and CRITICAL findings; SARIF goes to code scanning. Not
      # part of ci-ok: the vulnerability DB download and new CVEs against an
      # unchanged tree must not block merges. Nightly scans the same images.
      - if: matrix.arch == 'amd64'
        uses: ./.github/actions/scan-image
        with:
          image: ac-${{ matrix.component }}:ci
          category: image-${{ matrix.component }}
          # Fork and Dependabot PR tokens cannot write security events.
          upload: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

  # Integration tier (`just test-int`): Postgres in docker compose, then the
  # demos and the malicious relay double on the demo image (built here, never
  # pushed). Not part of ci-ok until it has a track record.
  integration:
    needs: changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,cargo-nextest
      - run: just test-int

  # Single required check for merge gating (.github/required-checks.txt).
  # Passes when every job succeeded or was skipped by `changes` (or, for the
  # pull-request-only jobs, by the event); a skip caused by a failed dependency
  # fails it (scripts/changes.py gate).
  ci-ok:
    if: always()
    needs: [changes, lint, rust, python, licences, contract, changelog, docs, hygiene]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: All required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The base branch's gate, for the reason given in `changes`. When
          # the base has none, no code of the pull request runs: every job
          # must have succeeded, with nothing skipped. Pushes run the gate
          # that is on main.
          if [ "$EVENT" != pull_request ]; then
            python3 scripts/changes.py gate
            exit 0
          fi
          git rev-parse --verify --quiet "origin/$BASE^{commit}" > /dev/null
          present="$(git ls-tree --name-only "origin/$BASE" -- scripts/changes.py)"
          if [ -n "$present" ]; then
            git show "origin/$BASE:scripts/changes.py" > "$RUNNER_TEMP/changes.py"
            python3 "$RUNNER_TEMP/changes.py" gate
          else
            echo "the base has no scripts/changes.py: every job must have succeeded"
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
            jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
          fi

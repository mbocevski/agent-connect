name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_FROZEN: "1"

jobs:
  # Linux arm64 and macOS arm64 (non-gating; see ADR-001).
  platforms:
    uses: ./.github/workflows/platform-tests.yml

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just,cargo-deny
      - run: cargo deny check advisories
      - run: just licences
      - run: uv export --all-packages --no-emit-workspace --no-hashes --format requirements-txt > requirements.txt
      - run: uvx pip-audit==2.10.1 --strict -r requirements.txt

  # New CVEs against unchanged images: build the amd64 images from main and
  # scan them with Trivy (the same check as the PR `image` job).
  image-scan:
    name: image-scan (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [relay, directory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker buildx build --load --pull --platform linux/amd64 -t ac-${{ matrix.component }}:nightly -f ${{ matrix.component }}/Dockerfile .
      - uses: ./.github/actions/scan-image
        with:
          image: ac-${{ matrix.component }}:nightly
          category: image-${{ matrix.component }}

  mutants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just,cargo-mutants,cargo-nextest
      - run: just nightly-mutants

  # Quarantined tests and long property runs (non-gating).
  python-long:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      - run: uv sync --all-packages
      - run: just nightly-py

  # Rust branch coverage needs nightly rustc (`--branch` is unstable). It runs
  # here, never in the PR pipeline, and does not gate anything.
  rust-branch-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - run: just cov-rust-branch

  # External links in the docs (PR CI and the pre-commit hook check only
  # relative links and anchors, offline). Non-gating, like the rest of nightly.
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          # Options live in lychee.toml (loaded from the repo root).
          args: --no-progress '**/*.md'
          jobSummary: true

  # Scheduled-workflow failures only email whoever last edited the cron, so
  # keep one issue open while any nightly job fails: comment on it per failing
  # run, close it on the next fully green run.
  notify:
    if: always()
    needs: [platforms, audit, image-scan, mutants, python-long, rust-branch-coverage, links]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "nightly: failing jobs"
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- " + .key + " (" + .value.result + ")"' <<<"$NEEDS")"
          number="$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$failed" ]; then
            body="$(printf 'Nightly run %s failed:\n\n%s\n' "$RUN_URL" "$failed")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nightly run $RUN_URL passed."
          fi

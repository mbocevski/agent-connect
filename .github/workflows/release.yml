# Signed release: build artifacts, sign with Sigstore (cosign keyless), attach
# SLSA build provenance, publish a GitHub Release with CHANGELOG notes.
# workflow_dispatch runs everything except publishing (dry run).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_FROZEN: "1"

jobs:
  # One build per platform. Each signs and attests its own artifacts, so a
  # platform's job can be rerun alone. The pure-Python packages and the sdists
  # are built once, on x86_64 Linux.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-24.04
            manylinux: "2_28"
            relay: true
            pure: true
          - target: aarch64-linux
            os: ubuntu-24.04-arm
            manylinux: "2_28"
            relay: true
            pure: false
          - target: aarch64-macos
            os: macos-15
            manylinux: "off"
            relay: false
            pure: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Reproducible build environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME=/home" >> "$GITHUB_ENV"
      - name: Relay and directory binaries
        if: matrix.relay
        run: |
          cargo build --release --locked -p agentconnect-relay -p agentconnect-directory
          mkdir -p dist
          cp target/release/agentconnect-relay "dist/agentconnect-relay-${{ matrix.target }}"
          cp target/release/agentconnect-directory "dist/agentconnect-directory-${{ matrix.target }}"
      - name: Core wheel
        uses: ./.github/actions/core-wheel
        with:
          manylinux: ${{ matrix.manylinux }}
      - name: Python packages and sdists
        if: matrix.pure
        run: |
          uv build --all-packages --sdist --out-dir dist
          uv build --package agentconnect --wheel --out-dir dist
          uv build --package agentconnect-sdk --wheel --out-dir dist
      - name: Checksums
        run: |
          (cd dist && shasum -a 256 -- * > ../sums.tmp)
          mv sums.tmp "dist/SHA256SUMS-${{ matrix.target }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (cosign keyless)
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ matrix.target }}
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dist-*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: dist/*

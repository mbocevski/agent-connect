name: core-wheel
description: >-
  Build the agentconnect-core wheel (abi3, one wheel per platform) with maturin.
  Linux builds run in a manylinux container on the runner's own architecture;
  macOS builds run on the host and take RUSTFLAGS and SOURCE_DATE_EPOCH from
  the calling job's env.
inputs:
  out-dir:
    description: Directory, relative to the workspace root, that receives the wheel.
    default: dist
  manylinux:
    description: manylinux tag for Linux builds, or "off" for macOS.
    default: "2_28"
runs:
  using: composite
  steps:
    # The container does not see the host's env, so the calling workflow's
    # git-fetch settings (CARGO_NET_*) are passed on with `-e`. RUSTFLAGS is passed as one
    # token (docker-options splits on spaces): HOME, and with it Cargo and
    # rustup, moves under the workspace so a single prefix remap covers
    # every path.
    #
    # HOME is a tmpfs. openmls_sqlite_storage 0.3.0 embeds its SQL
    # migrations with refinery 0.9, which lists them in the directory's
    # readdir order (fixed in refinery 0.10, which the crate can't use yet).
    # On the runners' ext4 that order depends on the filesystem's hash seed,
    # so two runners build different wheels; a tmpfs lists files in the
    # order they were created, which unpacking the same .crate gives.
    # Remove this once the crate is on refinery 0.10.
    - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1.51.0
      with:
        command: build
        working-directory: core-py
        manylinux: ${{ inputs.manylinux }}
        args: --release --locked --out ../${{ inputs.out-dir }}
        # Vendored OpenSSL's Configure needs IPC::Cmd and Time::Piece, which
        # manylinux_2_28 does not ship. They only run the build; nothing of
        # them is in the wheel. Both come from AppStream; EPEL is disabled so
        # its mirrors can't fail the build.
        #
        # A mirror sometimes serves an empty repomd.xml ("Failed to download
        # metadata for repo 'baseos'"). The install is retried up to four
        # times with a growing pause and a metadata cache clean in between;
        # a failure that repeats still fails the step with dnf's output.
        before-script-linux: |
          attempt=1
          until dnf install -y --disablerepo=epel perl-IPC-Cmd perl-Time-Piece; do
            if [ "$attempt" -ge 4 ]; then
              echo "dnf install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "dnf install failed (attempt $attempt); retrying" >&2
            dnf clean metadata || true
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
        docker-options: >-
          -e SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          -e HOME=${{ github.workspace }}/.container-home
          -e CARGO_NET_GIT_FETCH_WITH_CLI=${{ env.CARGO_NET_GIT_FETCH_WITH_CLI }}
          -e CARGO_NET_RETRY=${{ env.CARGO_NET_RETRY }}
          --tmpfs ${{ github.workspace }}/.container-home:exec
          -e RUSTFLAGS=--remap-path-prefix=${{ github.workspace }}=/src

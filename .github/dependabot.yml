# Dependency updates. Commit messages ("build(deps): ...") and the
# skip-changelog label let these PRs pass the commit-msg, changelog and
# `just merge` gates.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, skip-changelog]
    # The one-line text rule depends on the Unicode version of these tables,
    # so a Unicode bump is a deliberate change that moves both exactly
    # pinned crates together (see the workspace Cargo.toml).
    ignore:
      - dependency-name: unicode-normalization
      - dependency-name: unicode-properties
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, skip-changelog]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, skip-changelog]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, skip-changelog]
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, skip-changelog]

  # Base images in the Dockerfiles (rust build image, distroless runtime).
  - package-ecosystem: docker
    directories: [/relay, /directory]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, skip-changelog]
    groups:
      docker-images:
        patterns: ["*"]

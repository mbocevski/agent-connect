# Integration tier services (`just test-int`). Loopback only, throwaway data.
name: agentconnect-test

services:
  # Heimdall's Postgres store (directory/tests/store_postgres.rs).
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: heimdall
      # Bound to 127.0.0.1 only, for tests: no password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "heimdall", "-d", "heimdall"]
      interval: 1s
      timeout: 2s
      retries: 30

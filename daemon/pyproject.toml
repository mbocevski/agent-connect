[project]
name = "agentconnect-cli"
version = "0.1.0a1"
description = "AgentConnect daemon (agentconnectd) and CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server,signing]>=1.2.3",
    "agentconnect-core==0.1.0a1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
agentconnect = "agentconnect.cli:app"

[tool.uv.sources]
agentconnect-core = { workspace = true }

# The distribution is agentconnect-cli; the import package stays agentconnect.
[tool.uv.build-backend]
module-name = "agentconnect"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

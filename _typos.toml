[files]
# Generated vectors are hex/base64 (core/src/vectors.rs).
extend-exclude = [
    "Cargo.lock",
    "uv.lock",
    "LICENSE",
    "testdata/sas-emoji.json",
    "testdata/hpke-pq-test-vectors.json",
    "testdata/instance-cert.json",
    "testdata/invite-kdf.json",
    "testdata/invite-urls.json",
    "testdata/padding-vectors.json",
    "testdata/sas-vectors.json",
    "testdata/listings.json",
    "testdata/listing-tokens.json",
    "testdata/withdrawals.json",
    "testdata/owner-files.json",
    "testdata/knocks.json",
    "testdata/group-policy.json",
    "testdata/identity-export.json",
    "core/fuzz/Cargo.lock",
]

[default.extend-words]
# hax: the verification toolchain libcrux is built with (hax-lib crates).
hax = "hax"
# certifi: the Python CA-bundle package (licences-py.toml, ADR-001 section 4).
certifi = "certifi"

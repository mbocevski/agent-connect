# cargo-deny policy (ADR-001 §4). AGPL/GPL are banned by omission from `allow`.

[graph]
all-features = true

[advisories]
yanked = "deny"
# RUSTSEC-2026-0329, -0330 and -0331 (libcrux-hmac-drbg 0.0.1, libcrux-kem
# 0.0.9) were cleared on 2026-10-18 by the `[patch.crates-io]` block in
# Cargo.toml, which takes the provider from an upstream commit that depends
# on the fixed releases. Don't ignore them again.
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; build-time only, via libcrux's hax-lib-macros" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Approved 2026-10-17 (ADR-001 §4). hpke-rs is the HPKE layer of both OpenMLS crypto providers (libcrux and
# rust-crypto), so OpenMLS can't be used without it. MPL-2.0 is file-level
# copyleft: using it unmodified is compatible with Apache-2.0 distribution;
# modifying its files would oblige us to publish those files. Scoped to these
# three crates only; MPL-2.0 is not allowed anywhere else.
[[licenses.exceptions]]
crate = "hpke-rs"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "hpke-rs-crypto"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "hpke-rs-libcrux"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unpublished (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git sources need a `rev`: cargo-deny refuses `branch` and `tag` sources,
# but accepts short revs and refs such as `refs/heads/main`, so
# `scripts/check_cargo_patch.py` additionally requires a full commit SHA. The
# only allowed source is upstream OpenMLS, for the temporary provider patch
# in Cargo.toml (RUSTSEC-2026-0329/-0330/-0331); remove it with that patch.
required-git-spec = "rev"
allow-git = ["https://github.com/openmls/openmls"]

[extend]
useDefault = true

# Lockfiles hold package names and checksums, never secrets. Crate names such
# as `libcrux-secrets` trip the generic-api-key rule.
[[allowlists]]
description = "dependency lockfiles"
paths = ['''(^|/)Cargo\.lock$''', '''(^|/)uv\.lock$''']

# Published test vectors: every value is derived from the seed stored in the
# file (core/src/vectors.rs), so these are test inputs, not credentials.
[[allowlists]]
description = "generated test vectors"
paths = [
    '''^testdata/(instance-cert|invite-kdf|invite-urls|padding-vectors|relay-auth|sas-vectors|listings|listing-tokens|withdrawals|owner-files|knocks)\.json$''',
]

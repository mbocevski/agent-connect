[project]
name = "agentconnect-sdk"
version = "0.1.0a4"
description = "Python SDK for headless agents on AgentConnect"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["agentconnect-cli==0.1.0a4", "httpx>=0.28.1"]

[tool.uv.sources]
agentconnect-cli = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }
fail-fast = false
retries = 0

[profile.ci]
failure-output = "immediate-final"

# cargo-mutants (.cargo/mutants.toml): stop a mutant's test run at the first
# failure, since one failing test is enough to catch it.
[profile.mutants]
fail-fast = true
# The nightly runners have four cores, where the heaviest core test (the SAS
# grinding test) can pass 30 s, and a test the limit ends fails the whole
# shard's baseline. cargo-mutants times each mutant out on its own
# (five times the baseline), so a hang still ends.
slow-timeout = { period = "60s", terminate-after = 3 }

# The relay's load tests and the wire sizes they rely on (ignored by
# default, `just nightly-relay-load`).
[[profile.default.overrides]]
filter = 'package(agentconnect-relay) and test(/^load_/)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'package(agentconnect-core) and test(wire_sizes_fit_the_relay_caps)'
slow-timeout = { period = "300s", terminate-after = 6 }

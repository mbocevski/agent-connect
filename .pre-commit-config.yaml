# Run with prek (`just setup` installs all hook types). Compatible with pre-commit.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      # Vendored vectors stay byte-for-byte as published (testdata/MANIFEST.json).
      - id: trailing-whitespace
        exclude: ^testdata/(sas-emoji|hpke-pq-test-vectors)\.json$
      - id: end-of-file-fixer
        exclude: ^testdata/(sas-emoji|hpke-pq-test-vectors)\.json$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      # Default schema catalogs fail to parse with taplo 0.10 (SchemaStore format
      # change), so lint syntax/structure only.
      - id: taplo-lint
        args: []

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Docs: Markdown lint, offline link check, prose rules (CONTRIBUTING.md).
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.0
    hooks:
      - id: rumdl-check

  # lychee's own hook script finds its install directory with git, which breaks
  # when git exports GIT_DIR to hooks (worktrees). Build the pinned release
  # from crates.io instead.
  - repo: local
    hooks:
      - id: lychee
        name: lychee (offline)
        language: rust
        additional_dependencies: ["cli:lychee:0.24.2"]
        # Relative links and anchors only; the nightly workflow checks the web.
        entry: lychee --no-progress --offline
        types_or: [markdown, html]
        exclude: ^testdata/
        require_serial: true

  - repo: https://github.com/vale-cli/vale
    rev: v3.25.1
    hooks:
      - id: vale
        types: [markdown]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --scopes=spec,core,relay,directory,daemon,a2a,mcp,sdk,web,policy,group,ci,docs,deps
          - feat
          - fix
          - docs
          - test
          - refactor
          - perf
          - build
          - ci
          - chore
          - revert
          - style

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --check
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        types: [rust]
        pass_filenames: false
      - id: cargo-doc
        name: cargo doc (deny warnings)
        language: system
        entry: env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps --locked --quiet
        types: [rust]
        pass_filenames: false
      - id: cargo-shear
        name: cargo shear (unused dependencies)
        language: system
        entry: cargo shear
        files: (Cargo\.toml|\.rs)$
        pass_filenames: false
      - id: cargo-patch
        name: provider patch in every workspace, full revs, no affected libcrux
        language: system
        entry: uv run --no-project python scripts/check_cargo_patch.py check
        files: (Cargo\.(toml|lock)|check_cargo_patch\.py)$
        pass_filenames: false
      - id: ty
        name: ty check
        language: system
        entry: uv run --all-packages --frozen ty check
        types: [python]
        pass_filenames: false

      - id: no-tool-refs
        name: no AI-tool attribution / tooling references
        language: system
        entry: uv run --frozen python scripts/hygiene.py files
        types: [text]
        # Upstream data (it contains a robot emoji entry), kept byte-for-byte,
        # and the SAS vectors that render codes with that table's emoji.
        exclude: ^testdata/(sas-emoji|sas-commit-reveal)\.json$
      - id: no-tool-refs-msg
        name: commit message has no AI-tool attribution
        language: system
        entry: uv run --frozen python scripts/hygiene.py msg
        stages: [commit-msg]

      # pre-push gates (see CONTRIBUTING.md)
      - id: no-push-main
        name: refuse direct push to main
        language: script
        entry: scripts/hooks/no-push-main.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: changelog
        name: CHANGELOG [Unreleased] updated
        language: script
        entry: scripts/check-changelog.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: docs-check
        name: docs changed with mapped code (docs/MAP.toml)
        language: system
        entry: uv run --no-project python scripts/check_docs.py
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: fast-tests
        name: just test (fast tier)
        language: system
        entry: just test
        stages: [pre-push]
        always_run: true
        pass_filenames: false

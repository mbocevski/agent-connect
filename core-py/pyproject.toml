[project]
name = "agentconnect-core"
version = "0.1.0a3"
description = "Python bindings for the AgentConnect protocol core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "agentconnect_core._native"
python-source = "python"
manifest-path = "Cargo.toml"
# Not `locked = true`: the sdist carries the whole workspace's Cargo.lock for
# a two-crate workspace, and cargo prunes the unused entries (it changes no
# version), which --locked refuses, so the sdist would not build. The
# release wheel (.github/actions/core-wheel) and the development build (the
# root pyproject.toml) pass --locked themselves.

# Rebuild the extension when any Rust input changes, not only pyproject.toml.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../core/Cargo.toml" },
    { file = "../core/src/**/*.rs" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
]

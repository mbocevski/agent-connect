[package]
name = "agentconnect-core-py"
description = "Python bindings for agentconnect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agentconnect_core_native"
crate-type = ["cdylib"]

[features]
# The test-only bindings (Client._add_knock_unchecked_for_testing,
# Client._commit_unchecked_for_testing, _authorize_for_testing). Off in the
# release wheel; the development environment (uv sync) turns it on, see
# [tool.uv.config-settings-package] in the root pyproject.toml.
test-hooks = ["agentconnect-core/test-hooks"]

[dependencies]
agentconnect-core.workspace = true
pyo3.workspace = true
zeroize.workspace = true

# PyO3's macros expand to unsafe code, so this crate can't inherit
# the workspace-wide `unsafe_code = "forbid"`.
[lints.clippy]
all = { level = "deny", priority = -1 }
